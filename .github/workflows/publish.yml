name: publish

# A release is cut by pushing the release tag: this workflow builds and tests the
# tagged tree, then publishes every workspace package whose own version is not on
# npm yet (settings and ftshare version independently; the tag is the
# repository's release number, not a package version).
#
# Authentication is npm trusted publishing over OIDC — no token secret. This
# workflow deliberately does NOT set NPM_CONFIG_PROVENANCE: the source repository
# is private and npm cannot attest a private repository, so enabling provenance
# would fail the publish outright.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and publish (e.g. v0.1.0)
        required: true

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read   # nothing is written back to the repository
  id-token: write  # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm -r build && pnpm -r test

      - name: Publish the versions npm does not have yet
        run: node scripts/publish-if-new.mjs
